services:
  postgres:
    image: postgres:16-alpine
    container_name: trips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips_dev_password
      POSTGRES_DB: trips
    ports:
      - "5433:5432"
    volumes:
      - trips_pgdata:/var/lib/postgresql/data

volumes:
  trips_pgdata:
